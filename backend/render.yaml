services:
  - type: web
    name: satyalekh-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY   # service-role secret (preferred)
        sync: false
      - key: SUPABASE_KEY           # publishable fallback
        sync: false
      - key: ALLOWED_ORIGINS        # CORS allowlist (comma-separated)
        sync: false
      - key: CRON_SECRET            # required for /watchlist/run-checks
        sync: false
      - key: NEWSDATA_API_KEY       # /news/gujarat proxy (optional)
        sync: false
      - key: STRIPE_ENABLED
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FREE_TRIAL_CREDITS
        value: "2"
    # Use the instant root ping — /health launches a full Chromium browser
    # (~5s + CPU) and Render probes the health path frequently.
    healthCheckPath: /
