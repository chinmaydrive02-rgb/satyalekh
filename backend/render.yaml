services:
  - type: web
    name: satyalekh-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: STRIPE_ENABLED
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FREE_TRIAL_CREDITS
        value: "2"
    # Use the instant root ping — /health launches a full Chromium browser
    # (~5s + CPU) and Render probes the health path frequently.
    healthCheckPath: /
